global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: testp-node
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9101

  - job_name: testp-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9102

  - job_name: testp-producer
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9103
